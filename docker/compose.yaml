services:
  teleop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    init: true
    stdin_open: true
    tty: true
    environment:
      LEROBOT_CLOUDXR_SKIP_AUTOLAUNCH: "1"
    command: ["--mode", "sim", "--print_config"]
