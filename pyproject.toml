[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "areumii-teleop"
version = "0.1.0"
description = "Standalone AReuMii bimanual XR teleoperation over UDP."
readme = "README.md"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
runtime = [
    "lerobot[kinematics]==0.6.1",
    "isaacteleop[cloudxr,retargeters]==1.4.98rc1",
    "placo==0.9.15",
    "cmeel-urdfdom>=4,<5",
    "cmeel-tinyxml2<11",
]

[project.scripts]
areumii-teleop = "areumii_teleop.cli:main"

[tool.setuptools]
packages = ["areumii_teleop", "areumii_teleop.assets", "isaac_teleop"]
package-dir = { areumii_teleop = "src/areumii_teleop", isaac_teleop = "isaac_teleop" }

[tool.setuptools.package-data]
areumii_teleop = ["assets/*.urdf", "assets/*.toml"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
isaacteleop = { index = "nvidia" }
