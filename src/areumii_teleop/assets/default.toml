# Runtime units: fps [Hz], translation [m], joint/gripper angles [rad], timeout [s].
[teleop]
mode = "sim"
fps = 30.0
clutch_threshold = 0.5
orientation_weight = 0.01
max_ee_step_m = 0.005
max_joint_step_rad = 0.02
max_gripper_step_rad = 0.05
feedback_timeout_s = 0.2

[robot]
joint_lower = [-3.142, -0.262, -1.396, -0.873, -1.745, -0.524, -1.571]
joint_upper = [3.142, 2.967, 1.396, 2.094, 1.745, 0.524, 1.571]
joint_margin = 0.01

[robot.joint_names]
left = ["shoulder_pitch_joint_L", "shoulder_roll_joint_L", "shouler_yaw_joint_L", "elbow_joint_L", "wrist_roll_joint_L", "wrist_yaw_joint_L", "wrist_pitch_joint_L"]
right = ["shoulder_pitch_joint_R", "shoulder_roll_joint_R", "shoulder_yaw_joint_R", "elbow_joint_R", "wrist_roll_joint_R", "wrist_yaw_joint_R", "wrist_pitch_joint_R"]

[robot.target_frame]
left = "gripper_hand_link_L_1"
right = "gripper_hand_link_R_1"

[robot.gripper_open]
left = -1.1
right = -1.1

[robot.gripper_close]
left = 0.7
right = 0.7
